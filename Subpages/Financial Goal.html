<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Goal Calculator - FinFlow</title>
  <style>
    header {
      background-color: #007bff;
      padding: 10px;
    }
    header nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 15px;
      font-weight: bold;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-image: url(Subpage_Images/Fin_Flow_Background.jpg);
        background-size: cover;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
    .container {
      max-width: 600px; /* Widened from 400px */
      margin: 40px auto; /* Added more top/bottom margin */
      background: white;
      padding: 40px; /* Increased padding for internal spacing */
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: none; /* Hidden until authenticated */
    }
    label {
      margin-top: 15px; /* Added spacing above labels */
      font-weight: bold;
    }
    input, button {
      display: block;
      width: 100%;
      margin: 15px 0; /* Increased vertical spacing */
      padding: 12px; /* Slightly larger padding for comfort */
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box; /* Ensures padding doesn’t affect width */
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    img {
      display: block;
      margin: 0 auto 30px; /* Centered with more bottom margin */
      max-width: 100%;
      width: 400px; /* Reduced from 800px */
      height: auto; /* Maintains aspect ratio */
    }
    h1 {
      text-align: center;
      margin-bottom: 30px; /* More space below title */
    }
    h2 {
      text-align: center;
      margin-top: 20px; /* Space above result */
    }
  </style>
</head>
<body>
  <!-- Firebase SDK (version 9+) -->
  <script type="module">
    import "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import "../firebase-config.js";
  </script>

  <header>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="expense_input.html">Expense Input</a>
      <a href="Financial Goal.html">Financial Goal</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <div class="container">
    <img src="../Images/Ram Financial Goal.jpg" alt="Financial Goal Image" />
    <h1 data-i18n="financial_goal_calculator">Financial Goal Calculator</h1>
    <label data-i18n="financial_goal" for="goal">Financial Goal ($):</label>
    <input type="number" id="goal" placeholder="Enter your financial goal">

    <label data-i18n="current_savings" for="currentSavings">Current Savings ($):</label>
    <input type="number" id="currentSavings" placeholder="Enter your current savings">

    <label data-i18n="monthly_savings" for="monthlySavings">Monthly Savings ($):</label>
    <input type="number" id="monthlySavings" placeholder="Enter your monthly savings">
    
    <button onclick="calculateAndSave()">Calculate & Save</button>
    
    <h2 id="result"></h2>
  </div>

  <script type="module">

    // Load saved language on page load
document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang") || "en";
  applyLanguage(savedLang);
});
    

    
    // Import Firebase functions
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const auth = getAuth();
    const db = getFirestore();

    // Check authentication state
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        console.log("🚨 User not authenticated. Redirecting to login...");
        window.location.href = "../index.html";
      } else {
        console.log("✅ User is authenticated:", user.email);
        document.querySelector(".container").style.display = "block";
      }
    });

  // Load selected language from user or localStorage
    async function loadUserLanguage(uid) {
      const userDoc = await getDoc(doc(db, "users", uid));
      let lang = "en";

      if (userDoc.exists()) {
        lang = userDoc.data().language || localStorage.getItem("lang") || "en";
      } else {
        lang = localStorage.getItem("lang") || "en";
      }

      document.getElementById("langSelect").value = lang;
      localStorage.setItem("lang", lang);
      await applyLanguage(lang);
    }

    // When user changes the dropdown
    window.changeLanguage = async function (lang) {
      const uid = auth.currentUser?.uid;
      localStorage.setItem("lang", lang);
      document.getElementById("langSelect").value = lang;
      await applyLanguage(lang);

      if (uid) {
        await setDoc(doc(db, "users", uid), { language: lang }, { merge: true });
      }
    };

    async function applyLanguage(lang) {
      const res = await fetch(`/lang/${lang}.json`);
      const messages = await res.json();

      // Static content
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (messages[key]) {
          el.textContent = messages[key];
        }
      });

      // Chart labels (optional: you can skip if charts aren't visible yet)
      if (window.updateCharts) {
        window.updateCharts(messages); // Hook for dynamic chart relabeling
      }
    }


    

    // Logout function
    window.logout = function () {
      signOut(auth)
        .then(() => {
          console.log("✅ User logged out");
          window.location.href = "../index.html";
        })
        .catch((error) => {
          console.error("🚨 Logout Error:", error);
        });
    };

    // Calculate savings and save to Firestore
    window.calculateAndSave = async function () {
      const user = auth.currentUser;
      if (!user) return;

      const goal = parseFloat(document.getElementById("goal").value);
      const currentSavings = parseFloat(document.getElementById("currentSavings").value);
      const monthlySavings = parseFloat(document.getElementById("monthlySavings").value);
      const resultElement = document.getElementById("result");

      if (isNaN(goal) || isNaN(currentSavings) || isNaN(monthlySavings) || monthlySavings <= 0) {
        resultElement.innerText = "Please enter valid positive numbers.";
        return;
      }

      const remainingAmount = goal - currentSavings;
      const monthsNeeded = remainingAmount / monthlySavings;

      let resultText;
      if (monthsNeeded <= 0) {
        resultText = "You have already reached your goal!";
      } else {
        resultText = `You need to save for ${Math.ceil(monthsNeeded)} more months to reach your goal.`;
      }
      resultElement.innerText = resultText;

      // Save to Firestore
      const goalData = {
        goal,
        currentSavings,
        monthlySavings,
        monthsNeeded: Math.ceil(monthsNeeded),
        timestamp: new Date().toISOString(),
      };

      try {
        const docRef = await addDoc(collection(db, "users", user.uid, "goals"), goalData);
        console.log("✅ Goal saved with ID:", docRef.id);
      } catch (error) {
        console.error("🚨 Error saving goal:", error);
        resultElement.innerText += " (Error saving goal, check console)";
      }
    };

    
  </script>
</body>
</html>
