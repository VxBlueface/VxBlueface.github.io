<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Input</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-image: url(Subpage_Images/Fin_Flow_Background.jpg);
        background-size: cover;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
      header {
        background-color: #007bff;
        padding: 10px;
      }
      header nav a {
        color: #fff;
        text-decoration: none;
        margin-right: 15px;
        font-weight: bold;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: none; /* Hidden until user is authenticated */
      }
      form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      label {
        margin-top: 10px;
        font-weight: bold;
      }
      input,
      select {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      button {
        grid-column: span 2;
        padding: 10px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        margin-top: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <!-- Firebase SDK (version 9+) -->
    <script type="module">
      import "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
      import "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
      import "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
      import "../firebase-config.js";
    </script>

    <div id="navbar-container"></div>

    <div class="container">
      <h1 data-i18n="expense_tracker">Expense Tracker</h1>

      <!-- Expense input form -->
      <form id="expenseForm">
        <div>
          <label for="category" data-i18n="category">Category</label>
          <select id="category" name="category" onchange="toggleOtherBox()">
            <option value="Finance" data-i18n="finance">Finance</option>
            <option value="Food" data-i18n="food">Food</option>
            <option value="Rent" data-i18n="rent">Rent</option>
            <option value="Utilities" data-i18n="utilities">Utilities</option>
            <option value="Entertainment" data-i18n="entertainment">Entertainment</option>
            <option value="Salary" data-i18n="salary">Salary</option>
            <option value="Transportation" data-i18n="transportation">Transportation</option>
            <option value="Other" data-i18n="other">Other</option>
          </select>
        </div>
        <div id="otherCategory" style="display: none;">
          <label for="otherC" data-i18n="otherC">Other Category</label>
          <input type="text" id="otherC" name="otherC" />
        </div>
        <div>
          <label for="type" data-i18n="type">Type</label>
          <select id="type" name="type">
            <option value="Expense" data-i18n="expense">Expense</option>
            <option value="Income" data-i18n="income">Income</option>
          </select>
        </div>
        <div>
          <label for="amount" data-i18n="amount">Amount</label>
          <input type="number" id="amount" name="amount" required />
        </div>
        <div>
          <label for="date" data-i18n="date">Date</label>
          <input type="date" id="date" name="date" required />
        </div>
        <button type="submit" data-i18n="add_entry">Add Entry</button>
      </form>

      <!-- Table to display expense data -->
      <table>
        <thead>
          <tr>
            <th data-i18n="category">Category</th>
            <th data-i18n="type">Type</th>
            <th data-i18n="amount">Amount</th>
            <th data-i18n="date">Date</th>
            <th data-i18n="action">Action</th>
          </tr>
        </thead>
        <tbody id="expenseTableBody"></tbody>
      </table>
      <div>
        <label for="currency" data-i18n="currency" data-i18n="currency">Currency</label>
        <select id="currency" name="currency">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="KRW">KRW (₩)</option>
          <option value="GBP">GBP (£)</option>            
        </select>
      </div>
      <button onclick="returnDashboard()" data-i18n="dashboard_return">Save Currency and Return to Dashboard</button>
    </div>

    <script type="module">
      // Load navbar component
    fetch("../components/navbar.html")
      .then(res => res.text())
      .then(html => {
        const container = document.getElementById("navbar-container");
        container.innerHTML = html;

        // Run any inline scripts manually
        const scripts = container.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
          oldScript.remove(); // optional: clean up
        });

        applyLanguage(localStorage.getItem("lang") || "en");
      });

      // When user changes the dropdown
    window.changeLanguage = async function (lang) {
      const uid = auth.currentUser?.uid;
      localStorage.setItem("lang", lang);
      document.getElementById("langSelect").value = lang;
      await applyLanguage(lang);

      if (uid) {
        await setDoc(doc(db, "users", uid), { language: lang }, { merge: true });
      }
    };

    async function applyLanguage(lang) {
      const res = await fetch(`/lang/${lang}.json`);
      const messages = await res.json();

      // Static content
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (messages[key]) {
          el.textContent = messages[key];
        }
      });

      // Chart labels (optional: you can skip if charts aren't visible yet)
      if (window.updateCharts) {
        window.updateCharts(messages); // Hook for dynamic chart relabeling
      }
    }


      // Import Firebase functions
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

      const auth = getAuth();
      const db = getFirestore();

      // Check authentication state
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          console.log("🚨 User not authenticated. Redirecting to login...");
          window.location.href = "../index.html";
        } else {
          console.log("✅ User is authenticated:", user.email);
          document.querySelector(".container").style.display = "block";
          loadExpenses(user.uid); // Load expenses for this user
        }
      });

      // Logout function
      window.logout = function () {
        signOut(auth)
          .then(() => {
            console.log("✅ User logged out");
            window.location.href = "../index.html";
          })
          .catch((error) => {
            console.error("🚨 Error logging out:", error);
          });
      };

      // Toggle "Other" category input
      window.toggleOtherBox = function () {
        const dropdown = document.getElementById("category");
        const inputContainer = document.getElementById("otherCategory");
        inputContainer.style.display = dropdown.value === "Other" ? "block" : "none";
      };

      // Add expense to Firestore and table
      document.getElementById("expenseForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const user = auth.currentUser;
        if (!user) return;

        let category = document.getElementById("category").value;
        const type = document.getElementById("type").value;
        const amount = parseFloat(document.getElementById("amount").value);
        const date = document.getElementById("date").value;
        
        if (category === "Other") {
          category = document.getElementById("otherC").value;
        }

        const expenseData = {
          category,
          type,
          amount,
          date,
          timestamp: new Date().toISOString(),
        };

        try {
          const docRef = await addDoc(collection(db, "users", user.uid, "expenses"), expenseData);
          console.log("✅ Expense added with ID:", docRef.id);

          // Add to table
          const tableBody = document.getElementById("expenseTableBody");
          const newRow = document.createElement("tr");
          newRow.setAttribute("data-id", docRef.id); // Store Firestore doc ID
          newRow.innerHTML = `
            <td>${category}</td>
            <td>${type}</td>
            <td>${amount}</td>
            <td>${date}</td>
            <td><button onclick="deleteRow('${docRef.id}', this)" data-i18n="delete">Delete</button></td>
          `;
          tableBody.appendChild(newRow);

          // Reset form
          document.getElementById("expenseForm").reset();
          document.getElementById("otherCategory").style.display = "none";
        } catch (error) {
          console.error("🚨 Error adding expense:", error);
        }
      });

      // Load expenses from Firestore
      async function loadExpenses(uid) {
        try {
          const expensesRef = collection(db, "users", uid, "expenses");
          const querySnapshot = await getDocs(expensesRef);
          const tableBody = document.getElementById("expenseTableBody");
          tableBody.innerHTML = ""; // Clear table

          querySnapshot.forEach((doc) => {
            const data = doc.data();
            const row = document.createElement("tr");
            row.setAttribute("data-id", doc.id);
            row.innerHTML = `
              <td>${data.category}</td>
              <td>${data.type}</td>
              <td>${data.amount}</td>
              <td>${data.date}</td>
              <td><button onclick="deleteRow('${doc.id}', this)">Delete</button></td>
            `;
            tableBody.appendChild(row);
          });
        } catch (error) {
          console.error("🚨 Error loading expenses:", error);
        }
      }

      // Delete expense from Firestore and table
      window.deleteRow = async function (docId, button) {
        try {
          await deleteDoc(doc(db, "users", auth.currentUser.uid, "expenses", docId));
          console.log("✅ Expense deleted with ID:", docId);
          button.parentElement.parentElement.remove();
        } catch (error) {
          console.error("🚨 Error deleting expense:", error);
        }
      };

      // Return to dashboard
      window.returnDashboard = function () {
        window.location.href = "dashboard.html";
      };
    </script>
  </body>
</html>
