<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard - FinFlow</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f0f0;
    }
    header {
      background-color: #007bff;
      padding: 10px;
    }
    header nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 15px;
      font-weight: bold;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      display: none; /* Hidden until authenticated */
    }
  </style>
</head>
<body>
  <!-- Firebase SDK (version 9+) -->
  <script type="module">
    import "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import "../firebase-config.js";
  </script>

  <!-- Reusable Navbar -->
  <header>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="expense_input.html">Expense Input</a>
      <a href="Financial Goal.html">Financial Goal</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <div class="container">
    <h1>User Dashboard</h1>
    <p id="welcomeMessage">Welcome to FinFlow!</p>
  </div>

  <script type="module">
    // Import Firebase functions
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const auth = getAuth();

    // Check authentication state
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        console.log("🚨 User not authenticated. Redirecting to login...");
        window.location.href = "../index.html";
      } else {
        console.log("✅ User is authenticated:", user.email);
        // Show the container and personalize the welcome message
        const container = document.querySelector(".container");
        container.style.display = "block";
        document.getElementById("welcomeMessage").textContent = `Welcome to FinFlow, ${user.email}!`;
      }
    });

    // Logout function
    window.logout = function () {
      signOut(auth)
        .then(() => {
          console.log("✅ User logged out");
          window.location.href = "../index.html";
        })
        .catch((error) => {
          console.error("🚨 Logout Error:", error);
        });
    };
  </script>
</body>
</html>
