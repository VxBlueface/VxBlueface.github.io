<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard - FinFlow</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-image: url(Subpage_Images/Fin_Flow_Background.jpg);
        background-size: cover;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }

    header {
      background-color: #007bff;
      padding: 10px;
    }

    header nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 15px;
      font-weight: bold;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      display: none;
      /* Hidden until authenticated */
    }

    canvas {
      max-width: 100%;
      height: auto !important;
    }

    .chart-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
    }

    .chart-wrapper {
      flex: 1 1 400px;
      max-width: 600px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <!-- Firebase SDK (version 9+) -->
  <script type="module">
    import "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import "../firebase-config.js";
  </script>

  <!-- Chart JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <div id="navbar-container"></div>

  <div class="container">
    <h1 data-i18n="dashboard_title">User Dashboard</h1>
    <p id="welcomeMessage" data-i18n="welcome">Welcome to FinFlow!</p>

    <div class="chart-grid">
      <div class="chart-wrapper">
        <h2 data-i18n="expense_breakdown">Expense Breakdown</h2>
        <canvas id="expenseChart" width="400" height="200"></canvas>
      </div>
      <div class="chart-wrapper">
        <h2 data-i18n="goal_progress">Goal Progress</h2>
        <canvas id="goalChart" width="400" height="200"></canvas>
      </div>
    </div>
  </div>


  <script type="module">
    // Load navbar component
    fetch("../components/navbar.html")
      .then(res => res.text())
      .then(html => {
        const container = document.getElementById("navbar-container");
        container.innerHTML = html;

        // Run any inline scripts manually
        const scripts = container.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
          oldScript.remove(); // optional: clean up
        });

        applyLanguage(localStorage.getItem("lang") || "en");
      });

    // Import Firebase functions
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { doc, setDoc, getFirestore, collection, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const auth = getAuth();

    // Check authentication state
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        console.log("🚨 User not authenticated. Redirecting to login...");
        window.location.href = "../index.html";
      } else {
        console.log("✅ User is authenticated:", user.email);
        // Show the container and personalize the welcome message
        const container = document.querySelector(".container");
        container.style.display = "block";
        document.getElementById("welcomeMessage").textContent = `Welcome to FinFlow, ${user.email}!`;

        await loadUserLanguage(user.uid);
        renderExpenseChart(user.uid);
        renderGoalChart(user.uid);
      }
    });

    // Load selected language from user or localStorage
    async function loadUserLanguage(uid) {
      const userDoc = await getDoc(doc(db, "users", uid));
      let lang = "en";

      if (userDoc.exists()) {
        lang = userDoc.data().language || localStorage.getItem("lang") || "en";
      } else {
        lang = localStorage.getItem("lang") || "en";
      }

      document.getElementById("langSelect").value = lang;
      localStorage.setItem("lang", lang);
      await applyLanguage(lang);
    }

    // When user changes the dropdown
    window.changeLanguage = async function (lang) {
      const uid = auth.currentUser?.uid;
      localStorage.setItem("lang", lang);
      document.getElementById("langSelect").value = lang;
      await applyLanguage(lang);

      if (uid) {
        await setDoc(doc(db, "users", uid), { language: lang }, { merge: true });
      }
    };

    async function applyLanguage(lang) {
      const res = await fetch(`/lang/${lang}.json`);
      const messages = await res.json();

      // Static content
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (messages[key]) {
          el.textContent = messages[key];
        }
      });

      // Chart labels (optional: you can skip if charts aren't visible yet)
      if (window.updateCharts) {
        window.updateCharts(messages); // Hook for dynamic chart relabeling
      }
    }

    // Logout function
    window.logout = function () {
      signOut(auth)
        .then(() => {
          console.log("✅ User logged out");
          window.location.href = "../index.html";
        })
        .catch((error) => {
          console.error("🚨 Logout Error:", error);
        });
    };

    const db = getFirestore();

    async function renderExpenseChart(uid) {
      const expensesSnapshot = await getDocs(collection(db, "users", uid, "expenses"));
      const categoryTotals = {};

      expensesSnapshot.forEach(doc => {
        const { category, amount } = doc.data();
        if (category in categoryTotals) {
          categoryTotals[category] += amount;
        } else {
          categoryTotals[category] = amount;
        }
      });

      const categories = Object.keys(categoryTotals);
      const amounts = Object.values(categoryTotals);

      expenseChartRef = new Chart(document.getElementById("expenseChart"), {
        type: "pie",
        data: {
          labels: categories, 
          datasets: [{
            label: "Expenses by Category" , // fallback, overwritten later
            data: amounts, 
            backgroundColor: [
              "#FF6384", "#36A2EB", "#FFCE56", "#4BC0C0", "#9966FF", "#FF9F40"
            ]
          }]
        }
      });

    }

    async function renderGoalChart(uid) {
      const goalsSnapshot = await getDocs(collection(db, "users", uid, "goals"));
      const expensesSnapshot = await getDocs(collection(db, "users", uid, "expenses"));

      const monthlyGoals = {}; // { "04/2025": { required: 200, timestamp: ... } }
      const actualSavings = {}; // { "04/2025": { income: 0, expense: 0 } }

      // Parse goal documents
      goalsSnapshot.forEach(doc => {
        const { goal, monthsNeeded, timestamp } = doc.data();
        const date = new Date(timestamp);
        const key = `${date.getMonth() + 1}`.padStart(2, "0") + "/" + date.getFullYear();

        const monthlyRequired = monthsNeeded > 0 ? goal / monthsNeeded : 0;
        monthlyGoals[key] = { required: monthlyRequired, timestamp: date };
      });

      // Parse expenses to build actual savings
      expensesSnapshot.forEach(doc => {
        const { amount, type, date } = doc.data(); // `date` is user-inputted

        if (!amount || !date) return;

        const dateObj = new Date(date);
        const key = `${dateObj.getMonth() + 1}`.padStart(2, "0") + "/" + dateObj.getFullYear();

        if (!(key in actualSavings)) {
          actualSavings[key] = { income: 0, expense: 0 };
        }

        if (type.toLowerCase() === "income") {
          actualSavings[key].income += amount;
        } else {
          actualSavings[key].expense += amount;
        }
      });

      // Prepare chart data
      const labels = Object.keys(monthlyGoals).sort((a, b) => new Date(monthlyGoals[a].timestamp) - new Date(monthlyGoals[b].timestamp));
      const requiredData = [];
      const actualData = [];

      labels.forEach(key => {
        const required = monthlyGoals[key].required;
        const income = actualSavings[key]?.income || 0;
        const expense = actualSavings[key]?.expense || 0;
        const net = income - expense;

        requiredData.push(required.toFixed(2));
        actualData.push(net.toFixed(2));
      });

      // Render chart
      goalChartRef = new Chart(document.getElementById("goalChart"), {
        type: "bar",
        data: {
          labels,
          datasets: [
            {
              label: "Required Savings", // fallback
              data: requiredData,
              backgroundColor: "#007bff"
            },
            {
              label: "Actual Savings",
              data: actualData,
              backgroundColor: "#28a745"
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: 'Monthly Savings Goal vs Actual' // fallback
            },
            tooltip: {
              mode: 'index',
              intersect: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'Amount ($)' // fallback
              }
            }
          }
        }
      });

    }

    // Store chart references so we can update labels
    let expenseChartRef, goalChartRef;

    window.updateCharts = function (messages) {
      if (expenseChartRef) {
        expenseChartRef.data.datasets[0].label = messages["chart_expenses_by_category"] || "Expenses by Category";
        expenseChartRef.update();
      }

      if (goalChartRef) {
        goalChartRef.data.datasets[0].label = messages["chart_required_savings"] || "Required Savings";
        goalChartRef.data.datasets[1].label = messages["chart_actual_savings"] || "Actual Savings";
        goalChartRef.options.plugins.title.text = messages["chart_main_title"] || "Monthly Savings Goal vs Actual";
        goalChartRef.options.scales.y.title.text = messages["chart_y_axis"] || "Amount ($)";
        goalChartRef.update();
      }
    };


  </script>
</body>

</html>
